[program:ticinew-queue-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/ticinew/artisan queue:work redis --queue=emails,default --sleep=1 --tries=3 --max-time=3600 --timeout=120
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=2
redirect_stderr=true
stdout_logfile=/var/www/ticinew/storage/logs/queue-worker.log
stopwaitsecs=3600

; Deploy sonrası:
; sudo supervisorctl reread
; sudo supervisorctl update
; sudo supervisorctl restart ticinew-queue-worker:*
